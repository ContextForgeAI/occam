<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Tooltip hosts</title></head>
<body>
<article>
  <h1>Tooltip hosts are source, payload is not</h1>
  <p>Identifiers live on the trigger/host; nested tooltip copy must not become code.</p>
  <pre><code>const x = <span class="tooltip-trigger">createServer
  <span role="tooltip">More info about createServer</span>
</span>();
const ac = <span class="tooltip">AbortController<span class="tooltiptext">Cancels in-flight work</span></span>;
const p = <button>parseConfig<span class="tooltip">Documentation about parseConfig</span></button>();
</code></pre>
</article>
</body>
</html>
