name: CI

on:
  push:
    branches: [main, repair/contributor-attribution-main]
  pull_request:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'benchmarks/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/FFOccamMcp.Core

      - name: Build
        run: dotnet build src/FFOccamMcp.Core -c Release --no-restore

      - name: Security — fail on vulnerable packages
        run: |
          dotnet list src/FFOccamMcp.Core package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "ERROR: vulnerable NuGet packages detected"; exit 1
          fi
          echo "OK: no vulnerable packages"

      - name: Publish AOT (linux-x64)
        # Compile + trim + native link gate. Binary is uploaded for gate-fast:
        # PublicMcpToolsListLiveTests spawns the published host (same resolve order as
        # launch-mcp-host.mjs) and asserts live tools/list schema parity.
        run: dotnet publish src/FFOccamMcp.Core -c Release -r linux-x64 --self-contained -o ./publish

      - name: Upload published host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: occam-host-linux-x64
          path: publish/OccamMcp.Core
          if-no-files-found: error
          retention-days: 1

  gate-fast:
    runs-on: ubuntu-latest
    needs: build
    env:
      OCCAM_HOME: ${{ github.workspace }}
      # NO OCCAM_ALLOW_PRIVATE_URLS here — on purpose. That flag skips the SSRF check, and with it the
      # pinned-dispatcher path that every real user hits by default. Setting it job-wide made this gate
      # test a configuration nobody runs, and it is exactly why CI stayed green while prod died on a
      # plain MDN 404 (the pool teardown hung on an unread body — only reachable WITH pinning).
      # The --fast tier is public URLs + unit tests only, so it does not need the flag.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'benchmarks/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: npm ci (workers)
        # workers/ is a single npm workspace — install from the root so deps hoist correctly.
        # Per-package `npm ci` leaves members without their hoisted deps → worker crashes →
        # no_json → workers_unavailable in the live smoke.
        run: npm ci --no-fund --no-audit
        working-directory: workers

      - name: Security — fail on vulnerable worker packages
        # Mirror the NuGet vuln scan for the Node side. Production deps only (--omit=dev);
        # high+ severity fails the gate. Lockfile is kept clean via workers/package.json overrides.
        run: npm audit --omit=dev --audit-level=high
        working-directory: workers

      # Place OccamMcp.Core at OCCAM_HOME root — first candidate in ResolvePublishedHostExecutable /
      # scripts/lib/resolve-host-binary.mjs (live tools/list public MCP contract).
      - name: Download published host
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: occam-host-linux-x64
          path: .

      - name: Make host executable
        run: chmod +x OccamMcp.Core && ls -la OccamMcp.Core

      - name: Build gate
        run: dotnet build benchmarks/l0-gate -c Release

      - name: L0 Gate (fast)
        run: dotnet run --project benchmarks/l0-gate -- --fast
        timeout-minutes: 5

      - name: MCP dual-era handshake
        env:
          OCCAM_FORCE_DOTNET_RUN: "0"
          OCCAM_PROFILE: full
        run: node scripts/lib/mcp-dual-era.selftest.mjs
        timeout-minutes: 5

      - name: MCP Streamable HTTP
        env:
          OCCAM_FORCE_DOTNET_RUN: "0"
          OCCAM_PROFILE: full
        run: node scripts/lib/mcp-streamable-http.selftest.mjs
        timeout-minutes: 3

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Enforce immutable external action refs
        run: |
          node scripts/check-workflow-action-pins.selftest.mjs
          node scripts/check-workflow-action-pins.mjs

      - name: Validate human and LLM documentation
        run: node scripts/check-docs.mjs

      - name: Git attribution guard
        run: |
          node scripts/check-git-attribution.selftest.mjs
          node scripts/check-git-attribution.mjs

      - name: Validate environment catalog against code
        run: node scripts/lib/operator/env-catalog.selftest.mjs

      - name: Validate install UX (quiet default / Ready semantics)
        run: node scripts/lib/operator/install-ux.selftest.mjs

      - name: Validate signer manifest/archive binding
        run: node scripts/lib/verify-release-manifest.selftest.mjs

      - name: Validate atomic release workflow policy
        run: |
          node scripts/lib/release-version.selftest.mjs
          node scripts/lib/release-asset-policy.selftest.mjs
          node scripts/lib/release-workflow.selftest.mjs

      - name: Validate first-run connect onboarding UX
        run: node scripts/lib/operator/connect-onboarding.selftest.mjs

      - name: Validate controlling-TTY / curl pipe interactivity
        run: node scripts/lib/operator/tty.selftest.mjs

      - name: Validate Cursor configured / no restart-loop state
        run: node scripts/lib/operator/cursor-state.selftest.mjs

      - name: Validate Playwright runtime recovery
        run: node workers/browser-extract/lib/ensure-chromium-usable.selftest.mjs

      - name: Validate friend first-use acceptance scenarios
        run: node scripts/lib/operator/friend-first-use.selftest.mjs

  operator-safety:
    name: Operator safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Validate archive preflight listing fallback
        run: node scripts/lib/archive-preflight-listing.selftest.mjs

      - name: Validate browser-actions worker selftest
        run: node workers/browser-extract/lib/browser-actions.selftest.mjs

      - name: Validate ff-occam package + clean-install from packed tarballs
        run: node scripts/lib/ff-occam-package.selftest.mjs

      - name: Validate bootstrap setup contract
        run: node scripts/lib/operator/bootstrap-setup.selftest.mjs

      - name: Validate platform release bootstrap and manifest rejection
        run: node scripts/lib/bootstrap-release-manifest.selftest.mjs

      - name: Validate public release RID matrix
        run: node scripts/lib/bootstrap-rid.selftest.mjs

      - name: Validate post-swap install rollback
        run: node scripts/lib/bootstrap-transaction.selftest.mjs

      - name: Validate self-contained release runtime closure
        run: node scripts/lib/operator/release-runtime-files.selftest.mjs

      - name: Validate user CLI launcher and PATH helpers
        run: node scripts/lib/operator/install-user-cli.selftest.mjs

      - name: Validate MCP host connect ownership and rollback
        run: node scripts/lib/operator/connect.selftest.mjs

      - name: Validate profile-aware Occam tools/list verification
        run: node scripts/lib/operator/connect/occam-verify.selftest.mjs

      - name: Validate reversible disconnect and uninstall boundaries
        run: node scripts/lib/operator/uninstall.selftest.mjs

      - name: Validate install-tree replace and lock helpers
        run: node scripts/lib/prepare-install-replace.selftest.mjs

      - name: Validate Occam process stop helpers
        run: node scripts/lib/stop-occam-processes.selftest.mjs

      - name: Validate release archive member preflight
        run: node scripts/lib/archive-preflight.selftest.mjs

      - name: Validate release tarball AppleDouble suppression
        run: node scripts/lib/build-release-tarball.selftest.mjs

      - name: Validate dual-contract bootstrap selection
        run: node scripts/lib/bootstrap-release-contract.selftest.mjs

      - name: Validate release authenticity policy contracts
        run: node scripts/lib/verify-release-signature.selftest.mjs

      # This is intentionally Windows-only and therefore cannot pass by taking
      # the selftest's non-Windows SKIP branch.
      - name: Validate real PowerShell irm | iex bootstrap semantics
        if: runner.os == 'Windows'
        run: node scripts/lib/bootstrap-ps1-pipe.selftest.mjs
