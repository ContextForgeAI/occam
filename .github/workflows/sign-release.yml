name: Verify Published Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published SemVer tag to verify (for example v1.0.0-rc.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify exact assets and signatures
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Resolve trusted verifier and release identity
        id: release-meta
        env:
          EVENT_DRAFT: ${{ github.event.release.draft }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          readonly verifier_path="ContextForgeAI/occam/.github/workflows/sign-release.yml"
          if [[ "$GITHUB_REPOSITORY" != "ContextForgeAI/occam" ]]; then
            echo "error: refusing to verify a different repository: $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" != "${verifier_path}@refs/heads/main" ]]; then
            echo "error: verifier must be the exact workflow from refs/heads/main" >&2
            echo "actual: $GITHUB_WORKFLOW_REF" >&2
            exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
            release)
              tag="${EVENT_TAG:-}"
              if [[ "$EVENT_DRAFT" == "true" || "$GITHUB_REF" != "refs/tags/${tag}" ]]; then
                echo "error: published release event tag/ref mismatch" >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              tag="${INPUT_TAG:-}"
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "error: manual verification must run from refs/heads/main" >&2
                exit 1
              fi
              ;;
            *)
              echo "error: unsupported verifier event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          node scripts/lib/release-version.mjs --ref "refs/tags/${tag}" >> "$GITHUB_OUTPUT"
          {
            printf 'tag=%s\n' "$tag"
            printf 'expected_identity=https://github.com/ContextForgeAI/occam/.github/workflows/occam-release.yml@refs/tags/%s\n' "$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Download all published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts/release

      - name: Verify published metadata and exact nine-asset set
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release-meta.outputs.prerelease }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > "$RUNNER_TEMP/release.json"
          node scripts/lib/release-asset-policy.mjs verify-release-json \
            --file "$RUNNER_TEMP/release.json" \
            --tag "$TAG" \
            --version "$VERSION" \
            --draft false \
            --prerelease "$PRERELEASE"
          node scripts/lib/release-asset-policy.mjs verify-directory \
            --directory artifacts/release \
            --version "$VERSION" \
            --signed true

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Verify keyless identity and tamper rejection
        env:
          EXPECTED_IDENTITY: ${{ steps.release-meta.outputs.expected_identity }}
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          archives=(
            "artifacts/release/ff-occam-${VERSION}-linux-x64.tar.gz"
            "artifacts/release/ff-occam-${VERSION}-osx-arm64.tar.gz"
            "artifacts/release/ff-occam-${VERSION}-win-x64.tar.gz"
          )
          for archive in "${archives[@]}"; do
            bundle="${archive}.bundle"
            cosign verify-blob "$archive" \
              --bundle "$bundle" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$EXPECTED_ISSUER"

            tampered="${archive}.tampered"
            cp -- "$archive" "$tampered"
            printf '\noccam-tamper-check\n' >> "$tampered"
            if cosign verify-blob "$tampered" \
              --bundle "$bundle" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$EXPECTED_ISSUER" >/dev/null 2>&1; then
              echo "error: Cosign accepted a tampered archive: $archive" >&2
              rm -f -- "$tampered"
              exit 1
            fi
            rm -f -- "$tampered"
          done
