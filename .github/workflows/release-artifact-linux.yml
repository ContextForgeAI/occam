# Read-only linux-x64 AOT release artifact acceptance (no publish / no OIDC write).
name: Release artifact linux-x64

on:
  push:
    branches: [main, release/**, integrate/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-artifact-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-linux-x64:
    name: Build and verify linux-x64 release archive
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Resolve build version
        id: release-meta
        run: >-
          node scripts/lib/release-version.mjs
          --workflow-ref "$GITHUB_REF"
          --changelog CHANGELOG.md >> "$GITHUB_OUTPUT"

      - name: Build and verify linux-x64 archive
        env:
          OCCAM_RELEASE_VERSION: ${{ steps.release-meta.outputs.version }}
        run: bash ./scripts/ci-release-build.sh linux-x64

      - name: Require exact linux-x64 output
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          test "$(find artifacts/releases -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "artifacts/releases/ff-occam-${VERSION}-linux-x64.tar.gz"
          test -f "artifacts/releases/ff-occam-${VERSION}-linux-x64-manifest.json"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (m.runtimeLayout !== "self-contained-v1") process.exit(2);
            if (m.signaturePolicy !== "required-cosign-v1") process.exit(3);
            if (m.rid !== "linux-x64") process.exit(4);
            console.log("manifest_ok", m.version, m.sha256);
          ' "artifacts/releases/ff-occam-${VERSION}-linux-x64-manifest.json"
          node scripts/lib/archive-preflight.mjs \
            --archive "artifacts/releases/ff-occam-${VERSION}-linux-x64.tar.gz" \
            --expected-root "ff-occam-${VERSION}-linux-x64"
