# Agent-First MVP gate — published AOT + subprocess MCP (hermes-smoke + popular-hosts).
# Hermes / any CI: same entrypoint as ./scripts/ci-agent-mvp-gate.sh
#
# Primary CI target: GitHub Actions with immutable external action refs.
name: agent-mvp-gate

on:
  push:
    branches: [main, repair/contributor-attribution-main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agent-mvp-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: MVP gate (AOT)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'benchmarks/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install worker dependencies
        run: npm ci --no-fund --no-audit
        working-directory: workers

      - name: Agent MVP gate (doctor + hermes + popular-hosts)
        env:
          OCCAM_HOME: ${{ github.workspace }}
          # Product default is reader (8 tools); MVP/hermes assert the full core catalog.
          OCCAM_PROFILE: full
        run: bash ./scripts/ci-agent-mvp-gate.sh

      - name: Upload gate artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-mvp-gate-failure
          path: |
            artifacts/agent-popular-hosts/
            artifacts/agent-mvp-gate/
          if-no-files-found: ignore
