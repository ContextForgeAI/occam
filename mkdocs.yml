site_name: Occam
site_description: Verifiable web and data layer for AI agents — local MCP extraction with honest failures and signed receipts.
site_url: https://contextforgeai.github.io/occam/
site_author: ContextForgeAI
copyright: Occam — AGPL-3.0-or-later

repo_url: https://github.com/ContextForgeAI/occam
repo_name: ContextForgeAI/occam
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: System theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  font:
    text: Source Sans 3
    code: Source Code Pro

plugins:
  - search:
      lang: en

hooks:
  - docs/hooks.py

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ContextForgeAI/occam
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

exclude_docs: |
  requirements.txt
  hooks.py
  stylesheets/**
  rc2/**
  maintenance/**
  development/**

validation:
  omitted_files: info
  absolute_links: ignore
  unrecognized_links: ignore
  anchors: warn

